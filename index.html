<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
    <title>NKD Expenses App</title>

    <link rel="stylesheet" href="StylesCommon.css" />
    <link rel="stylesheet" href="StylesTable.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <div class="primaryContainerDiv">
      <div id="loadingSpinner" style="display: none">
        <div class="spinner"></div>
      </div>
      <div class="infoPopup" id="successPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon success"></div>
          <h2 class="infoPopup-heading success">Success!</h2>
          <div id="successMessage" class="infoPopup-message"></div>
          <button class="green" id="successOkButton">OKAY</button>
        </div>
      </div>
      <div class="infoPopup" id="errorPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon error"></div>
          <h2 class="infoPopup-heading error">Error!</h2>
          <div id="errorMessage" class="infoPopup-message"></div>
          <button class="red" onclick="CLOSE_INFO_POPUP('errorPopup')">
            TRY AGAIN
          </button>
        </div>
      </div>
      <div class="infoPopup" id="infoPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon info"></div>
          <h2 class="infoPopup-heading info">Information</h2>
          <div id="infoMessage" class="infoPopup-message"></div>
          <button class="green" onclick="CLOSE_INFO_POPUP('infoPopup')">
            OKAY
          </button>
        </div>
      </div>
      <div class="infoPopup" id="confirmationPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon confirmation"></div>
          <div class="infoPopup-message" id="confirmationMessage"></div>
          <div class="button-row">
            <button class="red" id="confirmationNoButton">NO</button>
            <button class="green" id="confirmationYesButton">YES</button>
          </div>
        </div>
      </div>

      <div class="infoPopup" id="confirmationGridPopup">
        <div class="infoPopup-content">
          <div class="infoPopup-icon confirmation"></div>

          <!-- Status Text Area -->
          <div id="confirmationGridStatusText" class="heading"></div>

          <!-- Table Grid Container -->
          <div
            id="confirmationGridContainer"
            class="collection-table-container scrollable-content-table"
            style="margin-top: 10px"
          >
            <table id="confirmationGridTable">
              <thead id="confirmationGridTHead" class="table-header">
                <!-- Table headers will be dynamically generated here -->
              </thead>
              <tbody id="confirmationGridTBody">
                <!-- Table rows will be dynamically generated here -->
              </tbody>
            </table>
          </div>

          <!-- Buttons for Confirmation -->
          <div class="button-row">
            <button class="red" id="confirmationGridNoButton">NO</button>
            <button class="green" id="confirmationGridYesButton">YES</button>
          </div>
        </div>
      </div>

      <div class="popup" id="verificationGridPopup">
        <div
          class="popup-content scrollable-content"
          id="verificationGridSubPopup"
        >
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />
          <div
            class="user-info-block"
            id="verifyDetailsHeading_div"
            style="display: none"
          >
            <p id="verifyDetailsHeading_lbl"></p>
          </div>
          <div class="heading" id="gridHeading">Verify Details</div>
          <div class="button-row">
            <button class="red" id="verificationBackButton">Back</button>
            <button class="green" id="verificationSubmitBtn">Submit</button>
          </div>
        </div>
      </div>

      <div class="popup" style="display: flex" id="mainMenuPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />
          <h2>NKD Expense App</h2>
          <input
            type="text"
            id="passworTxtBox"
            placeholder="Password"
            required
          /
          <div class="error" id="passworTxtBoxError"></div>
          <div class="button-row">
            <button
              class="red"
              onclick="
                document.getElementById('passworTxtBox').value = '';
                document.getElementById('passworTxtBoxError').innerHTML = '';
              "
            >
              Clear
            </button>
            <button
              class="green"
              id="submitPassBtn"
              onclick="submitPass()"
              disabled
            >
              Login
            </button>
          </div>
        </div>
      </div>

      <div class="popup" id="userMenuPopup">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <h2>NKD Expense Dashboard</h2>         

          <div class="accordion-item" id="userDropdown">

            <button class="accordion-header" type="button">
                <span>User</span>
                <span class="icon">▶</span>
            </button>

            <div class="accordion-content">
                <button type="button" class="user-menu-item" id="addRequisitionBttn">
                    Raise New Requisition
                </button>

                <button type="button" class="user-menu-item" id="viewRequisitionBttn">
                    View Existing Requisition
                </button>
            </div>

          </div>

          <div class="accordion-item" id="financeUserDropdown">
            <button class="accordion-header" type="button">
                <span>Finance User</span>
                <span class="icon">▶</span>
            </button>
          </div>
          <div class="accordion-item" id="secondUserDropdown" >
            <button class="accordion-header">
              Second Level User
              <span class="icon">▶</span>
            </button>          
          </div>
          <div class="accordion-item" id="purchaserDropdown" >
            <button class="accordion-header">
              Purchaser
              <span class="icon">▶</span>
            </button>          
          </div>
          <div class="accordion-item" id="adminDropdown" >
            <button class="accordion-header">
              Administration
              <span class="icon">▶</span>
            </button>
          
          </div>

          <button class="red" onclick="onLogoutClick()">Logout</button>
        </div>
      </div>

      <div class="popup" id="raiseNewRequisitionId">
        <div class="popup-content scrollable-content">
          <img
            src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
            alt="NKD Logo"
          />

          <div>
            <p class="user-info-block"></p>
          </div>

          <br />
          <div class="controlRow">
            <label class="width30" for="expenseDate">Date:</label>
            <input type="date" class="width70" id="expenseDate" />
          </div>
          <div class="controlRow">
            <label class="width30" for="expenseDescription">Description:</label>
            <input
              type="text"
              class="width70"
              id="expenseDescription"
            />
          </div>
          <div class="controlRow">
            <label class="width30" for="expenseAmount">Amount:</label>
            <input
              type="text"
              class="width70"
              id="expenseAmount"
            />
          </div>
          <div class="controlRow">
            <label class="width30" for="expenseEndDate">ExpiryDate:</label>
            <input type="date" class="width70" id="expenseEndDate" />
          </div>
          <div class="controlRow">
              <label class="width30" for="expenseCategory">Category:</label>

              <select
                  class="width70"
                  id="expenseCategory">
                  <option value="">-- Select Category --</option>                  
                  <option value="Congregation">Congregation</option>
                  <option value="Gurukul">Gurukul</option>
              </select>
          </div>
          <div class="controlRow">
              <label class="width30" for="class">Sub Category:</label>
              <select class="width70" id="expenseSubCategory">
                <option value="">-- Select Student --</option>
                <option value="Printing">Printing</option>
                <option value="Stationary">Stationary</option>
                <option value="Other">Other</option>
              </select>
          </div>                    

          <div class="button-row">
            <button class="red" id="requisitionBackBttn">Back</button>
            <button class="red" id="resetRequisitionData">Reset</button>
            <button class="green" id="submitRequisition">Submit</button>
          </div>
         
        </div>
      </div>          
      
      
      <div class="popup" id="viewRequisitionsData">
          <div class="popup-content scrollable-content">

              <img
                  src="https://drive.google.com/thumbnail?id=1aYobBIvFM5yJUgqLktnHjzwxuFX0OfGn&sz=w500"
                  alt="NKD Logo"
              />

              <div>
                  <p class="user-info-block"></p>
              </div>

              <br />

              <h3>Requisition List</h3>

              <div class="table-container" id="requisitionTableContainer">
                  <table id="requisitionTable">
                      <thead>
                          <tr>
                              <th>Date</th>
                              <th>Description</th>
                              <th>Amount</th>
                              <th>Expiry Date</th>
                              <th>Category</th>
                              <th>Sub Category</th>
                              <th>Requestor</th>
                              <th>Status</th>
                              <th>Created Date</th>
                          </tr>
                      </thead>

                      <tbody id="requisitionTableBody">
                          <!-- Data will be populated here -->
                      </tbody>
                  </table>
              </div>

              <div class="button-row">
                  <button class="red" id="requisitionListBackBttn">
                      Back
                  </button>

                  <button class="green" id="addRequisitionFromViewBttn">
                      Raise New Requisition
                  </button>
              </div>

          </div>
      </div>


      
    </div>

    <script src="ScriptCommon.js"></script>
    <script src="ScriptConstants.js"></script>
    <script src="ScriptUser.js"></script>
  </body>
</html>
